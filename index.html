<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E8232A" />

    <!-- Favicon (you'll replace with the heart-house logo) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Default SEO meta — overridden per page by react-helmet-async -->
    <title>iLovah Cleaning & Rest In Pest Control — Toowoomba, Highfields, Helidon</title>
    <meta name="description" content="Family-owned cleaning & pest control across Toowoomba, Highfields, Helidon & Darling Downs. Bond-back guarantee, 12-month pest warranty. Call 0478 711 829." />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iLovah Cleaning & Rest In Pest Control" />
    <meta property="og:locale" content="en_AU" />

    <!-- Google Search Console verification — paste your real token here once you set up GSC -->
    <!-- <meta name="google-site-verification" content="PASTE_YOUR_TOKEN_HERE" /> -->

    <!-- Preconnect to font CDN for faster LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Nunito:wght@400;600;700;800;900&family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet" />

    <!-- Canonical defaults to current URL (per-page canonicals override this in React) -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
